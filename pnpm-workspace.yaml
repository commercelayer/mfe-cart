packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  esbuild: true
  iframe-resizer: true
  nx: true
minimumReleaseAgeExclude:
  - '@commercelayer/core-components@5.0.7 || 5.0.8'
  - '@commercelayer/react-components@5.0.7 || 5.0.8'
  - '@commercelayer/react-hooks-components@5.0.7 || 5.0.8'
  - '@commercelayer/sdk@8.0.3'
blockExoticSubdeps: false