packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  esbuild: true
  iframe-resizer: true
  nx: true
minimumReleaseAgeExclude:
  - '@commercelayer/core-components'
  - '@commercelayer/react-components'
  - '@commercelayer/react-hooks-components'
  - '@commercelayer/sdk'
overrides:
  '@commercelayer/core-components': 'https://pkg.pr.new/@commercelayer/core-components@be856bb'
  '@commercelayer/react-components': 'https://pkg.pr.new/@commercelayer/react-components@be856bb'
  '@commercelayer/react-hooks-components': 'https://pkg.pr.new/@commercelayer/react-hooks-components@be856bb'
blockExoticSubdeps: false