packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
allowBuilds:
  esbuild: true
  iframe-resizer: true
  nx: true
minimumReleaseAgeExclude:
  - cronstrue@3.27.0
overrides:
  # Force patched versions of vulnerable transitive deps (all via lerna)
  tar: '>=7.5.22'
  js-yaml: '>=4.3.1 <5'
  brace-expansion: '>=5.0.9'
